name: Shorts research and discovery

# Phase 1: movie name → TMDB identity, cast, clips, Wikipedia plot and full subtitles.
on:
  workflow_dispatch:
    inputs:
      movie:
        description: Movie name, optionally with its year, e.g. Nobody (2021)
        required: true
        type: string
  push:
    branches: ['claude/**']
    paths:
      - 'shorts_pipeline/**'
      - 'scripts/phase0/films.json'
      - '.github/workflows/shorts-research.yml'

permissions:
  contents: read

concurrency:
  group: shorts-research-${{ github.ref }}
  cancel-in-progress: true  # the newest code supersedes older runs

jobs:
  movies:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.pick.outputs.list }}
      indexes: ${{ steps.pick.outputs.indexes }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          MOVIE: ${{ inputs.movie }}
        run: |
          python - <<'EOF'
          import json, os
          movie = os.environ.get("MOVIE", "").strip()
          films = [movie] if movie else [f"{f['title']} ({f['year']})" for f in json.load(open("scripts/phase0/films.json"))]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"list={json.dumps(films)}\n")
              out.write(f"indexes={json.dumps(list(range(len(films))))}\n")
          EOF

  shorts:
    # The real one-button pipeline, once per movie, all movies side by side. Each movie moves
    # through its stages at its own pace (no waiting for the slowest movie between stages).
    name: shorts (${{ fromJSON(needs.movies.outputs.list)[matrix.index] }})
    needs: movies
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.movies.outputs.indexes) }}
    uses: ./.github/workflows/generate-shorts.yml
    with:
      movie: ${{ fromJSON(needs.movies.outputs.list)[matrix.index] }}
      narrator: warguy
      length: '150'
      speech_model: original
      max_stories: 1
      tag: m${{ matrix.index }}-
    secrets: inherit

  summary:
    needs: [movies, shorts]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'm*-discover', path: all}
      - uses: actions/download-artifact@v4
        with: {pattern: 'm*-write', path: all}
      - uses: actions/download-artifact@v4
        with: {pattern: 'm*-shorts', path: all}
      - name: Scripts, review results and quality numbers for every movie
        run: |
          python3 - <<'EOF'
          import glob, json, os
          from pathlib import Path
          out = []
          for movie in sorted({Path(p).name.split("-")[0] for p in glob.glob("all/m*-*")}):
              disc = Path(f"all/{movie}-discover/summary.json")
              if disc.exists():
                  d = json.loads(disc.read_text())
                  out += [f"# {movie}: {d.get('movie', '?')}", json.dumps({k: v for k, v in d.items() if not isinstance(v, (list, dict))})[:600], ""]
              scripts = Path(f"all/{movie}-write/scripts.md")
              out += [scripts.read_text() if scripts.exists() else "(no scripts)", ""]
              for review in sorted(glob.glob(f"all/{movie}-shorts/*/review.json")):
                  out.append(f"## review {review.split('/')[-2]}")
                  out += [f"- {c['status'].upper()} {c['check']}: {c['detail']}" for c in json.load(open(review))]
                  out.append("")
              out.append("---")
          text = "\n".join(out)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text + "\n")
          EOF
