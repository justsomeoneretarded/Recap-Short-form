name: Generate Shorts

on:
  workflow_dispatch:
    inputs:
      title:
        description: Short title
        required: true
        type: string
      source_url:
        description: Direct HTTPS source footage URL (GitHub Release attachments work)
        required: true
        type: string
      brief:
        description: Story angle and editing instructions
        required: true
        type: string
      story_notes:
        description: Verified story context, names, and events to cover
        required: false
        type: string
      narrator:
        description: Narrator
        type: choice
        options: [warguy, kit-laser, female]
        default: warguy
      target_seconds:
        description: Maximum length in seconds (15–180)
        default: '150'
        type: string
      aspect:
        description: Square matches the reference files; vertical is 9:16
        type: choice
        options: [square, vertical]
        default: square
      speech_model:
        description: Chatterbox speech model
        type: choice
        options: [original, turbo, nano]
        default: original
      writer_model:
        description: Local writer (Qwen fits smaller CPU runners; Gemma matches Top10)
        type: choice
        options: ['qwen3:4b-instruct-2507-q4_K_M', 'gemma4:12b']
        default: 'qwen3:4b-instruct-2507-q4_K_M'
      source_window:
        description: Optional source excerpt start,end in seconds (for example 51,73)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      HF_HOME: ${{ github.workspace }}/work/huggingface
      TORCH_HOME: ${{ github.workspace }}/work/torch
      OLLAMA_MODELS: ${{ github.workspace }}/work/ollama
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      SHORTS_CPU_THREADS: '4'
      SHORTS_WHISPER_MODEL: base.en
      SCRIPT_MODEL: ${{ inputs.writer_model || 'qwen3:4b-instruct-2507-q4_K_M' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core zstd
      - name: Validate inputs before model downloads
        env:
          SHORTS_INPUTS: ${{ toJSON(inputs) }}
        run: PYTHONPATH=. python scripts/workflow_request.py
      - name: Install CPU models and pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -e '.[voice,analysis,source]'
          python -m pip check
          python -m pip freeze > work/resolved-environment.txt
      - name: Start Ollama and prepare models
        run: |
          python scripts/install_ollama.py
          "$RUNNER_TEMP/shorts-ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          python scripts/prepare_models.py
      - name: Generate short
        run: python -m shorts_pipeline generate --request work/request.json --workdir work/production --output output/shorts
      - name: Upload video and review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/shorts/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload model logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/ollama.log
          if-no-files-found: ignore
