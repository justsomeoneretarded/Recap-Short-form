name: Generate Shorts

# One button: movie name → up to five finished Shorts (square + vertical, 60 fps) with covers,
# titles, description, tags, captions and a quality review. All models run free on the runner.
on:
  workflow_dispatch:
    inputs:
      movie:
        description: Movie name, optionally with its year, e.g. Nobody (2021)
        required: true
        type: string
      narrator:
        description: Narrator voice
        type: choice
        options: [warguy, kit-laser, female]
        default: warguy
      length:
        description: Length of each Short in seconds
        type: choice
        options: ['60', '90', '120', '150', '180']
        default: '150'
      speech_model:
        description: Speech model (original sounds best; turbo and nano are faster)
        type: choice
        options: [original, turbo, nano]
        default: original
      max_stories:
        description: Most Shorts to make from this movie
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '5'
      footage:
        description: How much YouTube footage the movie has (auto decides by itself)
        type: choice
        options: [auto, plenty, rare]
        default: auto

  workflow_call:  # the five-movie test runs this exact pipeline once per movie, side by side
    inputs:
      movie: {type: string, required: true}
      narrator: {type: string, default: warguy}
      length: {type: string, default: '150'}
      speech_model: {type: string, default: original}
      max_stories: {type: number, default: 5}
      tag: {type: string, default: '', description: Prefix for artifact names when several movies share one run}
      footage: {type: string, default: auto}

permissions:
  contents: read

concurrency:
  group: generate-shorts-${{ github.run_id }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Optional free Google AI Studio key. With it, Gemini watches the clips, writes the scripts, matches
  # sentences to shots, picks covers and reviews each finished Short; without it, everything runs locally.
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # Models whose daily free limit is used up are remembered here (shipped with the discover results),
  # so later jobs skip them instead of spending a request to find out again.
  SHORTS_GEMINI_STATE: output/discover/gemini-state.json

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      movie: ${{ steps.check.outputs.movie }}
      narrator: ${{ steps.check.outputs.narrator }}
      length: ${{ steps.check.outputs.length }}
      speech_model: ${{ steps.check.outputs.speech_model }}
      stories: ${{ steps.check.outputs.stories }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs before model downloads
        id: check
        env:
          SHORTS_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/validate_inputs.py

  discover:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      slots: ${{ steps.stories.outputs.slots }}
      every: ${{ steps.stories.outputs.every }}
    env:
      HF_HOME: ${{ github.workspace }}/work/huggingface
      SHORTS_CPU_THREADS: '4'
      MOVIE: ${{ needs.validate.outputs.movie }}
      LENGTH: ${{ needs.validate.outputs.length }}
      MAX_STORIES: ${{ needs.validate.outputs.stories }}
      SHORTS_FOOTAGE: ${{ inputs.footage || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg, downloader, OCR and Whisper
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' http://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt > /dev/null; fi
          ( sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg jq ) || ( sleep 15 && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg jq )
          python -m pip install -e '.[source,screening]' 'faster-whisper>=1.2,<2' 'bgutil-ytdlp-pot-provider>=2.0'
      - name: Prepare optional YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python scripts/prepare_youtube_cookies.py
      - name: Start YouTube proof-of-origin token provider
        continue-on-error: true
        run: docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
      - name: Prepare WARP fallback route
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/phase0/warp_proxy.sh
      - name: Restore research and Whisper model
        uses: actions/cache@v4
        with:
          path: |
            work/shorts/research
            work/shorts/placement
            work/huggingface
          key: shorts-generate-v1-${{ needs.validate.outputs.movie }}-${{ github.run_id }}
          restore-keys: shorts-generate-v1-${{ needs.validate.outputs.movie }}-
      - name: Research the movie, find, rank, place and screen clips, group stories
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: python -u -m shorts_pipeline discover --movie "$MOVIE" --screen 10 --length "$LENGTH" --output output/discover
      - name: Count the stories (one writing machine each, up to 5)
        id: stories
        env:
          MAX_STORIES: ${{ needs.validate.outputs.stories }}
        run: |
          python - <<'EOF'
          import json, os
          limit = int(os.environ.get("MAX_STORIES") or 5)
          count = min(limit, len(json.load(open("output/discover/arcs.json")).get("arcs", [])))
          if not count:
              raise SystemExit("No story could be built from the clips; see output/discover/summary.json")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"slots={json.dumps(list(range(count)))}\nevery={count}\n")
          print("Stories to write:", count)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.tag }}discover
          path: output/discover
          retention-days: 7

  write-story:
    # Every story is written on its own machine at the same time (the writer is the slow CPU step).
    needs: [validate, discover]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.discover.outputs.slots) }}
    env:
      SCRIPT_MODEL: qwen3:14b
      SHORTS_WRITER_MODEL: qwen3:14b
      OLLAMA_MODELS: ${{ github.workspace }}/work/ollama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pipeline and Ollama with Qwen3 14B
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' http://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt > /dev/null; fi
          ( sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends zstd ) || ( sleep 15 && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends zstd )
          python -m pip install -e .
          cat > "$RUNNER_TEMP/local-writer.sh" <<'SH'
          set -e
          python scripts/install_ollama.py
          # Flash attention and an 8-bit KV cache: faster on long prompts on CPU, same output quality.
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 nohup "$RUNNER_TEMP/shorts-ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version > /dev/null && break; sleep 1; done
          "$RUNNER_TEMP/shorts-ollama/bin/ollama" pull qwen3:14b > /dev/null
          SH
          if [ -n "$GEMINI_API_KEY" ]; then
            # Gemini writes; the local writer gets ready in the background in case Gemini cannot.
            nohup bash "$RUNNER_TEMP/local-writer.sh" > "$RUNNER_TEMP/local-writer.log" 2>&1 &
          else
            bash "$RUNNER_TEMP/local-writer.sh"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tag }}discover
          path: output/discover
      - name: Write this story's script (Gemini, or 2 local drafts judged and fixed)
        run: python -u -m shorts_pipeline write --from output/discover --output output/write --max-arcs 5 --drafts 2 --arc-index ${{ matrix.slot }} --spare-every ${{ needs.discover.outputs.every }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}write-part-${{ matrix.slot }}
          path: output/write
          retention-days: 2

  write:
    # Joins the per-story scripts into one folder, in story order.
    needs: [write-story]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      arcs: ${{ steps.arcs.outputs.arcs }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.tag }}write-part-*
          path: parts
      - name: Join the scripts and list the stories to produce
        id: arcs
        run: |
          python3 - <<'EOF'
          import glob, json, os
          from pathlib import Path
          out = Path("output/write"); out.mkdir(parents=True, exist_ok=True)
          results, markdown = [], []
          for folder in sorted(glob.glob("parts/*write-part-*"), key=lambda p: int(p.rsplit("-", 1)[1])):
              scripts = Path(folder, "scripts.json")
              if scripts.exists():
                  results += json.loads(scripts.read_text())
                  text = Path(folder, "scripts.md").read_text()
                  markdown.append(text if not markdown else text.split("\n", 2)[-1])
          if not results:
              raise SystemExit("No story could be written; see the write-story jobs")
          (out / "scripts.json").write_text(json.dumps(results, indent=1))
          (out / "scripts.md").write_text("\n".join(markdown))
          arcs = [r["arc"] for r in results]
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"arcs={json.dumps(arcs)}\n")
          print("Stories:", arcs)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}write
          path: output/write
          retention-days: 7

  voice:
    needs: [validate, write]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        arc: ${{ fromJSON(needs.write.outputs.arcs) }}
    env:
      HF_HOME: ${{ github.workspace }}/work/huggingface
      TORCH_HOME: ${{ github.workspace }}/work/torch
      SHORTS_CPU_THREADS: '4'
      SHORTS_YUNET_MODEL: ${{ github.workspace }}/work/models/face_detection_yunet_2023mar.onnx
      ARC: ${{ matrix.arc }}
      NARRATOR: ${{ needs.validate.outputs.narrator }}
      SPEECH_MODEL: ${{ needs.validate.outputs.speech_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg, Chatterbox, Whisper and OpenCV
        timeout-minutes: 25
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' http://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt > /dev/null; fi
          ( sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg fonts-dejavu-core jq ) || ( sleep 15 && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg fonts-dejavu-core jq )
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[voice,source,screening]' 'faster-whisper>=1.2,<2' 'bgutil-ytdlp-pot-provider>=2.0'
          mkdir -p work/models
          curl -fsSL --retry 3 -o "$SHORTS_YUNET_MODEL" https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx || echo "::warning::YuNet face model unavailable; framing uses motion only"
      - name: Prepare optional YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python scripts/prepare_youtube_cookies.py
      - name: Start YouTube proof-of-origin token provider
        continue-on-error: true
        run: docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
      - name: Prepare WARP fallback route
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/phase0/warp_proxy.sh
      - name: Restore voice, alignment and Whisper models
        uses: actions/cache@v4
        with:
          path: |
            work/huggingface
            work/torch
          key: shorts-make-models-v2  # includes the alignment model
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tag }}discover
          path: output/discover
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tag }}write
          path: output/write
      - name: Voice the script and make captions
        run: python -u -m shorts_pipeline voice --discover output/discover --scripts output/write --output output/voice --arc "$ARC" --narrator "$NARRATOR" --tts-model "$SPEECH_MODEL"
      - name: Plan the edit and the framing of every shot
        run: python -u -m shorts_pipeline edit-plan --discover output/discover --voice output/voice --output output/edit
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}voice-${{ matrix.arc }}
          path: |
            output/voice
            output/edit
          retention-days: 7
      - name: Ship this story's clips to the render machines (no YouTube downloads there)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}footage-${{ matrix.arc }}
          path: work/shorts/footage/*.mp4
          compression-level: 0
          retention-days: 2

  render:
    # Every story × shape is split into 4 chunks rendered on separate machines at the same time.
    needs: [write, voice]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arc: ${{ fromJSON(needs.write.outputs.arcs) }}
        aspect: [square, vertical]
        chunk: [0, 1, 2, 3]
    env:
      ARC: ${{ matrix.arc }}
      ASPECT: ${{ matrix.aspect }}
      CHUNK: ${{ matrix.chunk }}
      SHORTS_RIFE_BUDGET: '9000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Get this story's clips from the voice machine
        id: footage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tag }}footage-${{ matrix.arc }}
          path: work/shorts/footage
      - uses: actions/setup-node@v4
        if: steps.footage.outcome != 'success'
        with:
          node-version: '22'
      - name: Install FFmpeg, downloader and RIFE
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' http://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt > /dev/null; fi
          ( sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg jq unzip libvulkan1 mesa-vulkan-drivers libgomp1 ) || ( sleep 15 && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg jq unzip libvulkan1 mesa-vulkan-drivers libgomp1 )
          python -m pip install -e '.[source]' 'bgutil-ytdlp-pot-provider>=2.0'
          bash scripts/install_rife.sh || echo "::warning::RIFE unavailable; 60 fps uses motion-blended interpolation"
      - name: Prepare optional YouTube cookies
        if: steps.footage.outcome != 'success'
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python scripts/prepare_youtube_cookies.py
      - name: Start YouTube proof-of-origin token provider
        if: steps.footage.outcome != 'success'
        continue-on-error: true
        run: docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
      - name: Prepare WARP fallback route
        if: steps.footage.outcome != 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/phase0/warp_proxy.sh
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tag }}voice-${{ matrix.arc }}
          path: output
      - name: Render this chunk (RIFE on moving shots, blending on calm ones)
        run: python -u -m shorts_pipeline render-part --edit output/edit --arc "$ARC" --aspect "$ASPECT" --chunk "$CHUNK" --chunks 4 --output output/parts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}parts-${{ matrix.arc }}-${{ matrix.aspect }}-${{ matrix.chunk }}
          path: output/parts
          retention-days: 2

  finish:
    needs: [validate, write, render]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arc: ${{ fromJSON(needs.write.outputs.arcs) }}
    env:
      ARC: ${{ matrix.arc }}
      LENGTH: ${{ needs.validate.outputs.length }}
      SHORTS_YUNET_MODEL: ${{ github.workspace }}/work/models/face_detection_yunet_2023mar.onnx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg, OCR and fonts
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' http://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt > /dev/null; fi
          ( sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg fonts-dejavu-core ) || ( sleep 15 && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg fonts-dejavu-core )
          python -m pip install -e '.[screening]'
          mkdir -p work/models
          curl -fsSL --retry 3 -o "$SHORTS_YUNET_MODEL" https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx || true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tag }}discover
          path: output/discover
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tag }}write
          path: output/write
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tag }}voice-${{ matrix.arc }}
          path: output
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.tag }}parts-${{ matrix.arc }}-*
          path: output/parts
          merge-multiple: true
      - name: Join the chunks, add the narrator, master and burn captions
        run: python -u -m shorts_pipeline finish --edit output/edit --voice output/voice --parts output/parts --arc "$ARC" --output output/render
      - name: Covers, titles, description, tags and quality review
        run: |
          python -u -m shorts_pipeline package --discover output/discover --scripts output/write --voice output/voice --render output/render --parts output/parts --output output/shorts --length "$LENGTH"
          mv output/shorts/summary.json "output/shorts/$ARC/summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.tag }}short-${{ matrix.arc }}
          path: output/shorts
          retention-days: 14

  collect:
    needs: [validate, finish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.tag }}short-*
          path: shorts
          merge-multiple: true
      - name: Summary
        env:
          MOVIE: ${{ needs.validate.outputs.movie }}
        run: |
          python3 - <<'EOF'
          import glob, json, os
          rows = [f"## Shorts for {os.environ['MOVIE']}", "", "| Story | Title | Review | Notes |", "|---|---|---|---|"]
          for path in sorted(glob.glob("shorts/*/summary.json")):
              for r in json.load(open(path)):
                  rows.append(f"| {r['arc']} | {r['title']} | {r['verdict'].upper()} | {'; '.join(r['warnings'])[:200] or '–'} |")
          rows += ["", "Download **Artifacts → shorts** below: one folder per Short with final-square.mp4, "
                   "final-vertical.mp4, covers, title-options.txt, description.txt, tags.txt, captions and review.html."]
          text = "\n".join(rows)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text + "\n")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}shorts
          path: shorts
          retention-days: 14
