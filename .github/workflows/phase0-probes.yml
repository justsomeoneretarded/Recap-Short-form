name: Phase 0 probes

# Measurements only: these jobs never change production code or packages.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/phase0/**'
      - '.github/workflows/phase0-probes.yml'

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.ref }}
  cancel-in-progress: true

env:
  PROBE_OUT: work/phase0

jobs:
  youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and downloader
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then echo https://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt > /dev/null; fi
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update -qq && sudo apt-get $APT install -y --no-install-recommends ffmpeg jq
          python -m pip install 'yt-dlp[default]>=2026.1.1' 'bgutil-ytdlp-pot-provider>=2.0' requests
      - name: Start YouTube proof-of-origin token provider
        continue-on-error: true
        run: docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
      - name: Prepare optional WARP fallback route
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/phase0/warp_proxy.sh
      - name: Probe search, ranking signals and downloads
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python -u scripts/phase0/probe_youtube.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-youtube
          path: work/phase0/youtube
          retention-days: 7

  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Probe plot, subtitle and screenplay sources
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: python -u scripts/phase0/probe_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-research
          path: work/phase0/research
          retention-days: 7

  writers-local:
    # GitHub Models is not reachable from these runners (stub "OK" responses), so the
    # bake-off compares free local models on the same CPU runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ['gemma4:12b', 'qwen3:14b', 'phi4:14b', 'gemma3:12b']
    env:
      SCRIPT_MODEL: gemma4:12b
      OLLAMA_MODELS: ${{ github.workspace }}/work/ollama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then echo https://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt > /dev/null; fi
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update -qq && sudo apt-get $APT install -y --no-install-recommends zstd
          python -m pip install requests
      - name: Start Ollama and pull ${{ matrix.model }}
        run: |
          python scripts/install_ollama.py
          "$RUNNER_TEMP/shorts-ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          "$RUNNER_TEMP/shorts-ollama/bin/ollama" pull "${{ matrix.model }}"
      - name: Write the sample brief
        run: python -u scripts/phase0/probe_writers.py --backend ollama --model "${{ matrix.model }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-writers-${{ strategy.job-index }}
          path: work/phase0/writers-ollama
          retention-days: 7

  interpolation:
    needs: youtube
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and CPU Vulkan (lavapipe)
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then echo https://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt > /dev/null; fi
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update -qq && sudo apt-get $APT install -y --no-install-recommends ffmpeg mesa-vulkan-drivers libvulkan1 libgomp1
          python -m pip install requests
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phase0-youtube
          path: work/phase0/youtube
      - name: Time 24→60 fps methods
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/phase0/probe_interpolation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-interpolation
          path: |
            work/phase0/interpolation
            !work/phase0/interpolation/frames
            !work/phase0/interpolation/rife-bin
          retention-days: 7
